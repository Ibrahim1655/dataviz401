# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Régions
api_regions_index:
    path: /api/regions
    controller: App\Controller\RegionController::index
    methods: [GET]

api_regions_show:
    path: /api/regions/{code}
    controller: App\Controller\RegionController::show
    methods: [GET]

# Départements
api_departements_index:
    path: /api/departements
    controller: App\Controller\DepartementController::index
    methods: [GET]

api_departements_show:
    path: /api/departements/{code}
    controller: App\Controller\DepartementController::show
    methods: [GET]

# Statistiques — les routes fixes AVANT les routes avec paramètre
api_statistiques_annees:
    path: /api/statistiques/annees
    controller: App\Controller\StatistiquesController::annees
    methods: [GET]

api_statistiques_by_region:
    path: /api/statistiques/region/{codeRegion}
    controller: App\Controller\StatistiquesController::byRegion
    methods: [GET]

api_statistiques_index:
    path: /api/statistiques
    controller: App\Controller\StatistiquesController::index
    methods: [GET]

api_statistiques_show:
    path: /api/statistiques/{id}
    controller: App\Controller\StatistiquesController::show
    methods: [GET]
